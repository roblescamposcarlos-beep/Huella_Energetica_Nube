<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huella energética de la nube</title>
<style>
  :root {
    --verde: #2e7d32;
    --verde-oscuro: #1b5e20;
    --verde-claro: #e8f5e9;
    --cielo: #e1f5fe;
    --tierra: #6d4c41;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, var(--cielo), var(--verde-claro));
    color: #263238;
    line-height: 1.55;
  }
  header {
    background: var(--verde-oscuro);
    color: #fff;
    padding: 24px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.7rem; }
  header p { margin: 0 auto; max-width: 640px; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  form {
    background: #fff;
    border-top: 6px solid var(--verde);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
  label { display: block; font-weight: 600; margin-top: 14px; font-size: 0.95rem; }
  label:first-of-type { margin-top: 0; }
  input[type="number"] {
    width: 100%;
    margin-top: 4px;
    padding: 10px;
    border: 1px solid #a5d6a7;
    border-radius: 6px;
    font: inherit;
  }
  input:focus { outline: 2px solid var(--verde); }
  button {
    width: 100%;
    margin-top: 18px;
    background: var(--verde);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--verde-oscuro); }
  button:disabled { background: #9e9e9e; cursor: not-allowed; }
  #aviso { color: #c62828; font-weight: 600; min-height: 1.4em; margin-top: 10px; }
  #resultado {
    display: none;
    margin-top: 16px;
    background: #fff;
    border-left: 6px solid var(--tierra);
    border-radius: 10px;
    padding: 16px;
    white-space: pre-line;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }
</style>
</head>
<body>
<header>
  <h1>Huella energética de la nube</h1>
  <p>Cada acción digital se procesa en centros de datos que consumen energía. Esta página estima tu huella.</p>
</header>

<main>
  <form id="formulario" novalidate>
    <label for="video">Video en streaming (horas al día: YouTube, Netflix, TikTok)</label>
    <input type="number" id="video" min="0" step="any">

    <label for="musica">Música en streaming (horas al día)</label>
    <input type="number" id="musica" min="0" step="any">

    <label for="redes">Redes sociales (horas al día)</label>
    <input type="number" id="redes" min="0" step="any">

    <label for="videollamadas">Videollamadas (horas a la semana)</label>
    <input type="number" id="videollamadas" min="0" step="any">

    <label for="juegos">Juegos en línea (horas al día)</label>
    <input type="number" id="juegos" min="0" step="any">

    <label for="nube">GB guardados en la nube (fotos, archivos)</label>
    <input type="number" id="nube" min="0" step="any">

    <label for="ia">Consultas al día a chatbots de IA</label>
    <input type="number" id="ia" min="0" step="any">

    <label for="correos">Correos que envías al día</label>
    <input type="number" id="correos" min="0" step="any">

    <button type="submit" id="boton">Calcular mi huella</button>
    <div id="aviso" role="alert"></div>
  </form>
  <div id="resultado" aria-live="polite"></div>
</main>

<script>
  // Pega aquí la URL de tu webhook de Make
  const WEBHOOK_URL = "https://hook.us2.make.com/58cs0bohttkyeu4kf5limd2al2p75op1";

  const CAMPOS = ["video", "musica", "redes", "videollamadas", "juegos", "nube", "ia", "correos"];

  const formulario = document.getElementById("formulario");
  const boton = document.getElementById("boton");
  const aviso = document.getElementById("aviso");
  const resultado = document.getElementById("resultado");

  formulario.addEventListener("submit", async function (e) {
    e.preventDefault();
    aviso.textContent = "";

    const cuerpo = new URLSearchParams();
    for (const campo of CAMPOS) {
      const valor = document.getElementById(campo).value.trim();
      if (valor === "" || Number(valor) < 0) {
        aviso.textContent = "Llena todos los campos con un número igual o mayor que 0.";
        return;
      }
      cuerpo.append(campo, valor);
    }

    boton.disabled = true;
    resultado.style.display = "block";
    resultado.textContent = "Calculando...";

    try {
      const resp = await fetch(WEBHOOK_URL, { method: "POST", body: cuerpo });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      resultado.textContent = await resp.text();
    } catch (err) {
      resultado.textContent = "No se pudo calcular, intenta de nuevo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
